[package]
name = "routeforge-domain"
description = "RouteForge domain types and geo helpers; with the `db` feature, PostgreSQL persistence and the job queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# PostgreSQL repositories, migrations and the job queue.
# Enabled by routeforge-api and routeforge-solver, never by routeforge-bot.
db = ["dep:sqlx"]
# OpenAPI schemas for the types the HTTP API sends and receives.
# Enabled by routeforge-api, which serves the document.
openapi = ["dep:utoipa"]

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
utoipa = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
# The crate's own tests always get both features, so `cargo test -p routeforge-domain`
# cannot skip the database tests, or the schemas, by leaving one out. Dev-dependencies
# do not reach the bot.
routeforge-domain = { workspace = true, features = ["db", "openapi"] }
tokio.workspace = true

[lints]
workspace = true
