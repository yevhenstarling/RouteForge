[package]
name = "routeforge-domain"
description = "RouteForge domain types and geo helpers; with the `db` feature, PostgreSQL persistence and the job queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# PostgreSQL repositories, migrations and the job queue.
# Enabled by routeforge-api and routeforge-solver, never by routeforge-bot.
db = ["dep:sqlx"]

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true
