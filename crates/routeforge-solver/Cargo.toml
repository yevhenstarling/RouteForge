[package]
name = "routeforge-solver"
description = "RouteForge queue worker: claims plan and route jobs and computes courier routes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
routeforge-domain = { workspace = true, features = ["db", "service"] }
routeforge-tsp.workspace = true

anyhow.workspace = true
# For the jitter of the polling interval, from a generator seeded with the worker's id.
rand.workspace = true
# For asking an OSRM server for road distances (D66). It is on the compose network or
# on this machine, so nothing of the TLS the workspace builds reqwest with is used.
reqwest.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
chrono.workspace = true
serde_json.workspace = true
# For the tests that read what a worker logs. The solver itself logs through
# `routeforge_domain::service` (D81).
tracing-subscriber.workspace = true
# A server inside a test, in the place of OSRM.
wiremock.workspace = true

[lints]
workspace = true
