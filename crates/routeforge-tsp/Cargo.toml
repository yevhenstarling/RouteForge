[package]
name = "routeforge-tsp"
description = "Clustering and route optimization for RouteForge: pure computation, no I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The benchmarks bring criterion's harness. Without this, `cargo bench -- <criterion flag>`
# also reaches the default harness of the library, which rejects the flag.
bench = false

[dependencies]
rand.workspace = true
rand_chacha.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "stages"
harness = false

[lints]
workspace = true
