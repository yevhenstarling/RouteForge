name: routeforge

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routeforge}
      POSTGRES_DB: ${POSTGRES_DB:-routeforge}
    ports:
      # Published on localhost only, for running the services and tests outside Docker.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The queue workers. `docker compose up --scale solver=4` runs four of them: the
  # service has no container name and publishes no port, so nothing stands in the way.
  #
  # A solver applies no migrations. It waits until the database has the schema (D32),
  # which the API applies when it starts. The API gets a service of its own here in
  # Phase 6. Until then it runs on the host:
  #   cargo run -p routeforge-api
  solver:
    build:
      context: .
      target: solver
    environment:
      # `db` is the service above, on the compose network. The URL in .env is for
      # programs outside Docker and says 127.0.0.1.
      DATABASE_URL: postgres://${POSTGRES_USER:-routeforge}:${POSTGRES_PASSWORD:-routeforge}@db:5432/${POSTGRES_DB:-routeforge}
      # Passed on if set in .env or in the shell, and left to their defaults if not.
      SOLVER_CONCURRENCY:
      SOLVER_LEASE_SECS:
      SOLVER_HEARTBEAT_SECS:
      SOLVER_POLL_SECS:
      LOG_FORMAT:
      RUST_LOG:
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
